[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths =
    accounts
    approval_center
    assets
    changes
    cmdb
    common
    inventory
    licensing
    lifecycle
    monitoring
    problem_management
    procurement
    services
    tickets
    workflow
# Build the test database from the models instead of replaying every
# migration. Migration correctness is verified separately with
# `manage.py migrate` (see APPLICATION_RELEASE_READINESS_REPORT.md), while
# the suite itself stays fast and repeatable.
# --ds takes precedence over an exported DJANGO_SETTINGS_MODULE so the suite
# always uses the fast test settings, regardless of the developer shell.
addopts = --nomigrations --ds=config.settings_test --ignore=append_tests.py --ignore=rewrite_tests.py --ignore=run_tests.py --ignore=monitoring/count_tests.py
