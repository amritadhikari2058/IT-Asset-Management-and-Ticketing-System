name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        workdir: frontend

      - name: Run frontend lint
        run: npm run lint
        workdir: frontend

      - name: Run frontend tests
        run: npm run test
        workdir: frontend

      - name: Run production frontend build
        run: npm run build
        workdir: frontend
