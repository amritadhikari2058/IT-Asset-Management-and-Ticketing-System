name: it-asset-ticketing

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,gateway}
      DATABASE__ENGINE: django.db.backends.postgresql
      DATABASE__NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DATABASE__HOST: db
      DATABASE__PORT: "5432"
      DATABASE__USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
      - edge
      - egress

  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks:
      - edge
      - backend

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE__ENGINE: django.db.backends.postgresql
      DATABASE__NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DATABASE__HOST: db
      DATABASE__PORT: "5432"
      DATABASE__USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}", "--max-tasks-per-child=1000"]
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from config.celery import app; assert app.control.inspect(timeout=5).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 1m
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
      - egress

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE__ENGINE: django.db.backends.postgresql
      DATABASE__NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DATABASE__HOST: db
      DATABASE__PORT: "5432"
      DATABASE__USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid", "--schedule=/var/lib/celery/celerybeat-schedule"]
    volumes:
      - beat-data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib; os.kill(int(pathlib.Path('/tmp/celerybeat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 1m
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE__ENGINE: django.db.backends.postgresql
      DATABASE__NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DATABASE__HOST: db
      DATABASE__PORT: "5432"
      DATABASE__USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]
    networks:
      - backend

  collectstatic:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    volumes:
      - static-data:/app/staticfiles
    restart: "no"
    profiles: ["ops"]
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  media-data:
  static-data:
  beat-data:

networks:
  backend:
    internal: true
  edge:
  egress:
